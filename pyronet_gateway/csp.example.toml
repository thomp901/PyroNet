[postgres]
dsn = "postgresql://pyronet:pyronet@127.0.0.1:5432/pyronet"

[csp_http_api]
bind_host = "::"
port = 8080
max_request_body_bytes = 65536

[control_http_api]
bind_host = "::"
port = 8083
max_request_body_bytes = 65536

[gateway_api]
base_url = "http://127.0.0.1:8081"
http_timeout_seconds = 5.0

[control]
scheduler_poll_interval_seconds = 5.0

[neighbor_policy]
radius_meters = 1000.0
max_neighbors = 8
recompute_interval_seconds = 300

[time_sync]
interval_seconds = 86400
active_node_window_seconds = 86400

[connectivity]
stale_after_seconds = 900
poll_interval_seconds = 60

[runtime]
log_level = "INFO"
