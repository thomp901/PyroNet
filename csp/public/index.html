<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyroNet Centralized Platform</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <div id="dashboard">
        <aside id="sidebar">
            <header>
                <h1>PYRONET</h1>
                <p>Status: <span id="network-status">Monitoring Mesh...</span></p>
                <p>Devices Online: <span id="online-count">0</span></p>
            </header>
            <nav>
                <button class="nav-btn active" data-view="map">Map View</button>
                <button class="nav-btn" data-view="alerts">Alert History</button>
            </nav>
        </aside>
    
        <main id="main-content">
            <!-- Map View -->
            <div id="map-view" class="view-panel active">
                <div id="map"></div>
            </div>
            
            <!-- Alert History View -->
            <div id="alert-view" class="view-panel">
                <div id="alert-container">
                    <div id="alert-header">
                        <h2>Alert History</h2>
                        <div id="alert-filters">
                            <select id="filter-type">
                                <option value="all">All Events</option>
                                <option value="critical">Critical Alerts</option>
                                <option value="warning">Warnings</option>
                                <option value="info">Info</option>
                            </select>
                            <button id="clear-alerts" class="filter-btn">Clear All</button>
                        </div>
                    </div>
                    <div id="alert-list">
                        <!-- Alerts will be dynamically inserted here -->
                        <div class="no-alerts">No alerts recorded yet.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
